[workspace]
members = [
    "crates/netra-common",
    "crates/netra-network",
    "crates/netra-bluetooth",
    "crates/netra-traffic",
    "crates/netra-audio",
    "crates/netra-daemon",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Netra Contributors"]
license = "MIT"
repository = "https://github.com/netra/netra"

[workspace.dependencies]
tokio = { version = "1.38", features = ["full"] }
zbus = { version = "4.3", default-features = false, features = ["tokio"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
rtnetlink = "0.14"
netlink-packet-route = "0.19"
nix = { version = "0.29", features = ["net", "user", "process"] }
chrono = { version = "0.4", features = ["serde"] }
